runtime: nodejs20
instance_class: F1

env_variables:
  NODE_ENV: "production"

handlers:
  - url: /_next/static/(.*)
    static_files: .next/static/\1
    upload: .next/static/(.*)
    secure: always

  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10